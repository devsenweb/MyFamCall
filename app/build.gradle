plugins { id 'com.android.application' }
android {
    namespace 'com.myfamcall.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.myfamcall.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-foreground-prototype'
        // Optional smaller sideload preview. Default remains a universal APK.
        if (project.hasProperty('arm64Only')) { ndk { abiFilters 'arm64-v8a' } }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
    packaging { jniLibs { useLegacyPackaging false } }
}
dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.0.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'
    implementation 'io.getstream:stream-webrtc-android:1.3.10'
    testImplementation 'junit:junit:4.13.2'
}
